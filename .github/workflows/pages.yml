name: Publicar no GitHub Pages

# PARADO DE PROPÓSITO — só roda se alguém mandar rodar.
#
# Quem publica o site agora é a Cloudflare. Este workflow continuava
# empurrando o resultado para o ramo gh-pages, e a Cloudflare, vendo
# push naquele ramo, tentava construir ele também. Só que gh-pages
# guarda páginas prontas, não tem package.json, e o build quebrava.
# Eram duas falhas a cada publicação de verdade.
#
# O site que já está no GitHub Pages continua no ar, congelado no último
# build. Ele existe só para não quebrar links já compartilhados — some
# quando o domínio próprio entrar, que é também quando a cópia dupla
# deixa de atrapalhar o Google.
on:
  workflow_dispatch:

# Precisa escrever porque o build é empurrado para o branch gh-pages,
# que é de onde este repositório publica.
permissions:
  contents: write

# Dois pushes seguidos não disputam o mesmo branch.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O site é servido em /<repo>/, então precisa do basePath.
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      # Sem este arquivo o GitHub Pages trata o build como site Jekyll e
      # ignora a pasta _next/, derrubando todo o CSS e o JavaScript.
      - run: touch out/.nojekyll

      # O gh-pages guarda só o build mais recente: é resultado, não
      # histórico — o que importa fica versionado no main.
      - name: Publicar no branch gh-pages
        working-directory: out
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build de ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
